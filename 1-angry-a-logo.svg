<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Angry A logo</title>
  <desc id="desc">A sharp red letter A with narrowed eyes and heavy angled brows.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.55" stop-color="#c70f22"/>
      <stop offset="1" stop-color="#780014"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#120006" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- One angular A silhouette -->
    <path fill="url(#body)" fill-rule="evenodd" d="
      M600 95
      L1085 1070
      L846 1070
      L754 865
      L446 865
      L354 1070
      L115 1070
      Z
      M600 410
      L505 650
      L695 650
      Z"/>
    <!-- Angry eye sockets cut visually into the letter -->
    <path fill="#18030a" d="M315 548 L548 608 L518 717 L349 656 Z"/>
    <path fill="#18030a" d="M885 548 L652 608 L682 717 L851 656 Z"/>
    <!-- Eyes -->
    <path fill="#fff5f5" d="M355 590 L520 630 L500 687 L385 650 Z"/>
    <path fill="#fff5f5" d="M845 590 L680 630 L700 687 L815 650 Z"/>
    <ellipse cx="458" cy="647" rx="24" ry="31" fill="#120006" transform="rotate(14 458 647)"/>
    <ellipse cx="742" cy="647" rx="24" ry="31" fill="#120006" transform="rotate(-14 742 647)"/>
    <!-- Heavy brows -->
    <path fill="#18030a" d="M295 494 L555 574 L530 617 L310 558 Z"/>
    <path fill="#18030a" d="M905 494 L645 574 L670 617 L890 558 Z"/>
  </g>
</svg>
